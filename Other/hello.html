<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <div>
    <p>Hello, World!</p>
  </div>
  <div id="demo"></div>
  <script>
    const div=document.querySelector('div');

    const att=document.createAttribute('class')

    att.value='hello'

    div.setAttributeNode(att);
  </script>
</body>
</html>
