<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To Do List</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Task Manager</h1>
    <input type="text" name="task" id="task" placeholder="Enter your task" />
    <button id="addTask" onclick="addTask()">Add Task</button>
    <input
      type="search"
      name=""
      id="search"
      placeholder="Search your task..."
    />
    <br />
    <div id="taskList"></div>
    <script>
      function addTask() {
        inputTask = document.querySelector("#task").value;
        taskList = document.getElementById("taskList");

        if (inputTask.trim() == "") {
          return;
        }
        const li = document.createElement("li");
        li.innerHTML = `<h3>${inputTask}</h3>`;

        const deleteBtn = document.createElement("button");
        deleteBtn.innerText = "Delete";
        deleteBtn.onclick = function () {
          li.remove();
          hr.remove();
        };

        const taskCompleteBtn = document.createElement("button");
        taskCompleteBtn.innerText = "Complete";
        taskCompleteBtn.onclick = function () {
          li.style.textDecoration = "line-through";
        };

        li.appendChild(taskCompleteBtn);

        li.appendChild(deleteBtn);
        const hr = document.createElement("hr");
        taskList.appendChild(li);
        taskList.appendChild(hr);
        
        const searchInput = document.querySelector("#search");
        searchInput.addEventListener('input',()=>{
          if(li.innerText.toLowerCase().includes(searchInput.value.toLowerCase())){
            li.style.display='block';
          }
          else{
            li.style.display='none'
          }
        })

      }
    </script>
  </body>
</html>
